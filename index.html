<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header class="header">
            <div class="search-container">
                <input type="text" id="city-input" placeholder="Enter city name...">
                <button id="search-btn">Search</button>
            </div>
            <div class="header-right">
                <button id="location-btn">Use Current Location</button>
                <div class="unit-toggle">
                    <span>°C</span>
                    <label class="switch">
                        <input type="checkbox" id="unit-switch">
                        <span class="slider round"></span>
                    </label>
                    <span>°F</span>
                </div>
            </div>
        </header>

        <main class="weather-content">
            <div id="loading" class="hidden">Loading...</div>
            <div id="error-message" class="hidden"></div>

            <section id="current-weather" class="weather-card hidden">
                <div class="current-weather-header">
                    <div>
                        <h2 id="city-name">--</h2>
                        <p id="current-date">--</p>
                    </div>
                    <div class="temp-container">
                        <img id="current-weather-icon" src="" alt="Weather Icon">
                        <span id="current-temp">--°</span>
                    </div>
                </div>
                <div class="current-weather-details">
                    <p>Feels like: <span id="feels-like">--°</span></p>
                    <p>Humidity: <span id="humidity">--%</span></p>
                    <p>Wind: <span id="wind-speed">--</span></p>
                </div>
            </section>

            <section id="hourly-forecast" class="hidden">
                <h3>Next 24 Hours</h3>
                <div id="hourly-container" class="hourly-container">
                </div>
            </section>

            <section id="forecast" class="hidden">
                <h3>5-Day Forecast</h3>
                <div id="forecast-container" class="forecast-container">
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
